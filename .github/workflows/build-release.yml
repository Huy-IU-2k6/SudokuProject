name: Build Sudoku Multi-Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false 
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Linux Core Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxrandr-dev libxcursor-dev libudev-dev libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev xorg-dev

    # THÊM BƯỚC NÀY ĐỂ FIX LỖI CPACK NSIS TRÊN WINDOWS
    - name: Install NSIS (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install nsis -y

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run CPack
      working-directory: build
      run: cpack -C Release

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Sudoku-Installer-${{ matrix.os }}
        path: |
          build/*.exe
          build/*.dmg
          build/*.deb
        if-no-files-found: warn