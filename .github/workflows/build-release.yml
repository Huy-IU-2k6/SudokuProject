name: Build Sudoku Multi-Platform

# Cấp quyền cho GitHub Actions được phép tự động tạo trang Release
permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # ĐIỂM MỚI: Lắng nghe khi bạn push một tag bắt đầu bằng chữ 'v'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false 
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install NSIS (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install nsis -y

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run CPack
      working-directory: build
      run: cpack -C Release

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Sudoku-Installer-${{ matrix.os }}
        path: |
          build/*.exe
          build/*.dmg
        if-no-files-found: warn

  # ========================================================
  # JOB MỚI: TỰ ĐỘNG TẠO RELEASE KHI CÓ TAG MỚI
  # ========================================================
  release:
    name: Publish Release
    needs: build # Bắt buộc phải đợi Job 'build' bên trên chạy xong và thành công
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Chỉ chạy Job này nếu bạn vừa tạo Tag
    
    steps:
    # 1. Tải toàn bộ file .exe và .dmg từ Job 'build' xuống máy ảo này
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: installers
        merge-multiple: true # Gom tất cả file Win và Mac vào chung 1 thư mục

    # 2. Tự động tạo trang Release và đính kèm các file đó vào
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: installers/* # Up tất cả file trong thư mục installers lên
        generate_release_notes: true # Tự động tạo ghi chú tóm tắt code bạn vừa sửa