name: Build Sudoku Multi-Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false 
      # ĐÃ XÓA UBUNTU, CHỈ CÒN WIN VÀ MAC
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Tải NSIS để đóng gói file cài đặt .exe cho Windows
    - name: Install NSIS (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install nsis -y

    # Cấu hình CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # Build Project
    - name: Build Project
      run: cmake --build build --config Release

    # Đóng gói Installer
    - name: Run CPack
      working-directory: build
      run: cpack -C Release

    # Upload thành quả
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Sudoku-Installer-${{ matrix.os }}
        path: |
          build/*.exe
          build/*.dmg
        if-no-files-found: warn